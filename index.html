function overviewMovement(value,previous,isCost){const change=growth(value,previous);if(change===null)return '<span class="movement neutral">—</span>';const difference=value-previous;if(difference===0)return `<span class="movement neutral">${pct(0)}</span>`;const favourable=isCost?difference<0:difference>0;return `<span class="movement ${favourable?'favourable':'adverse'}" aria-label="${difference>0?'Increase':'Decrease'}, ${favourable?'favourable':'unfavourable'}">${difference>0?'▲':'▼'} ${pct(Math.abs(change))}</span>`;}

function sankey(nodes,links,{w=1768,h=650}={}){if(!links.length)return empty();const maxCol=Math.max(...nodes.map(n=>n.col)),cols=Array.from({length:maxCol+1},()=>[]);nodes.forEach(o=>{o.incoming=0;o.outgoing=0;cols[o.col].push(o);});const map=new Map(nodes.map(o=>[o.id,o]));links.forEach(l=>{map.get(l.from).outgoing+=l.v;map.get(l.to).incoming+=l.v;});nodes.forEach(o=>o.v=Math.max(o.incoming,o.outgoing));const pad=14,top=48,bottom=44,usable=h-top-bottom;let k=Infinity;cols.forEach(a=>{const v=a.reduce((s,o)=>s+o.v,0);if(v>0)k=Math.min(k,(usable-pad*(a.length-1))/v);});if(!Number.isFinite(k)||k<=0)return empty('Too many flow nodes for the canvas; see full item detail');cols.forEach((a,c)=>{const used=a.reduce((s,o)=>s+o.v*k,0)+pad*(a.length-1);let y=top+(usable-used)/2;a.forEach(o=>{o.x=235+c*(w-485)/maxCol;o.y=y;o.h=o.v*k;o.si=0;o.ti=0;y+=o.h+pad;});});let out='';links.forEach(l=>{if(l.v<=0)return;const a=map.get(l.from),b=map.get(l.to),dy=l.v*k,y1=a.y+a.si+dy/2,y2=b.y+b.ti+dy/2;a.si+=dy;b.ti+=dy;const x1=a.x+17,x2=b.x,mid=(x1+x2)/2;out+=`<path d="M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}" fill="none" stroke="${l.color||a.color||'#669ecb'}" stroke-opacity=".48" stroke-width="${dy}">${tip(`${a.label} → ${b.label}: RM ${fmt(l.v)}`)}</path>`;});nodes.forEach(o=>{out+=`<rect x="${o.x}" y="${o.y}" width="17" height="${Math.max(1,o.h)}" fill="${o.color||palette[o.col%palette.length]}">${tip(`${o.label}: RM ${fmt(o.v)}`)}</rect>`;const right=o.col===maxCol,xx=right?o.x+25:o.x-9,anchor=right?'start':'end';out+=text(xx,o.y+o.h/2-4,o.label,'small',anchor)+text(xx,o.y+o.h/2+18,'RM '+fmt(o.v),'small val',anchor);});return svg(out,w,h);}

const statementNames=['P&L Inputs','Cash Unrestricted','Cash Restricted','Balance Sheet Inputs'];function statements(){const rows=DATA.sheets['S06 Financial Outlook']||[],sections=new Map(statementNames.map(s=>[s,[]]));let current=null,hasHeaders=false;rows.slice(5,88).forEach(row=>{const label=row?.[0];if(statementNames.includes(label)){current=label;hasHeaders=true;}else if(current&&label!==null&&label!==undefined&&label!=='')sections.get(current).push([label,num(row[1])]);});if(!hasHeaders){statementNames.forEach((s,i)=>{for(let r=6;r<=[30,18,20,28][i];r++){const label=cell(s,r,1);if(label!==null)sections.get(s).push([label,n(s,r,8)]);}});}return `<div class="statements">${statementNames.map((s,i)=>`<section class="statement"><h2>${['Profit & loss','Unrestricted cash flow','Restricted cash flow','Balance sheet'][i]}</h2><div class="unit">2027 full plan · RM</div><table><tbody>${sections.get(s).filter(([l])=>i!==3||!/check|ROA denominator/i.test(l)).map(([l,v])=>`<tr class="${totalRow(l)?'total-row':''}"><td>${esc(l)}</td><td>${fmt(v)}</td></tr>`).join('')||'<tr><td>Not supplied</td><td>—</td></tr>'}</tbody></table></section>`).join('')}</div>`;}
const plLabels=['Retail Operation','Office Rental','Parking Spaces','Land Lease','Finance Charges (Income)','Event Network Other','Grant OE','Grant DE','Total Revenue','Direct Material','Overhead','Manpower','G&A Travel','G&A Others','Professional Fees','Marketing','Total Direct / Indirect Cost','FD / Repo','EBITDA before extraordinary','D&A','Extraordinary expense','Financing','PBT','Tax','PAT'];function million(v){return num(v)===null?'—':new Intl.NumberFormat('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v/1000000);}function comparison(which){const historical=which===6,s=historical?'S07 Historical':'S08 Budget vs Forecast',heads=historical?['Category · RM million','2023 actual','2024 actual','Δ RM million','Δ %','2025 actual','Δ RM million','Δ %']:['Category · RM million','2026 budget','2026 forecast','Δ RM million','Δ %','2027 full plan','Δ RM million','Δ %'];let h='<table class="financial"><colgroup><col>'+Array(7).fill('<col>').join('')+'</colgroup><thead><tr>'+heads.map(v=>`<th>${v}</th>`).join('')+'</tr></thead><tbody>';for(let r=6;r<=28;r++){if(r===6||r===15)h+=`<tr class="section-band"><td colspan="8">${r===6?'Revenue':'Direct & indirect cost'}</td></tr>`;const label=cell(s,r,1)||cell('P&L Inputs',r,1)||plLabels[r-6];const cols=[2,3,5,6,4,7,8];const expense=(r>=15&&r<=22)||(r>=25&&r<=27);h+=`<tr class="${[14,22,24,28].includes(r)?'total-row':''} ${r===28?'pbt-row':''}"><td>${esc(label)}</td>${cols.map((c,i)=>{const v=n(s,r,c),variance=[2,3,5,6].includes(i),delta=variance?n(s,r,i<4?5:7):null;const tone=delta===null||delta===0?'':(expense?delta<0:delta>0)?'favourable':'adverse';const arrow=[2,5].includes(i)&&v!==null&&v!==0?`<span class="direction">${v>0?'▲':'▼'}</span>`:'';return `<td class="${variance?tone:''}">${[3,6].includes(i)?comparisonPercent(v):million(v)}${arrow}</td>`;}).join('')}</tr>`;}return h+'</tbody></table>';}
function comparisonPercent(v){return pct(num(v)===null?null:Math.max(-9.99,Math.min(9.99,v)));}
function comparisonWithBadDebts(which){const s=which===6?'S07 Historical':'S08 Budget vs Forecast';let html=comparison(which);const cols=[2,3,5,6,4,7,8];const row=`<tr><td>Bad and doubtful debts</td>${cols.map((c,i)=>{const v=n(s,31,c),variance=[2,3,5,6].includes(i),delta=variance?n(s,31,i<4?5:7):null,tone=delta===null||delta===0?'':delta<0?'favourable':'adverse',arrow=[2,5].includes(i)&&v!==null&&v!==0?`<span class="direction">${v>0?'▲':'▼'}</span>`:'';return `<td class="${variance?tone:''}">${[3,6].includes(i)?comparisonPercent(v):million(v)}${arrow}</td>`;}).join('')}</tr>`;return html.replace(/<tr class="total-row "><td>Total Direct[^<]*<\/td>/,match=>row+match);}
// Presentation-only missing-value convention. Leave source data and diagnostics intact.
function slideMissingValues(html){const fragment=document.createElement('template');fragment.innerHTML=html;const walker=document.createTreeWalker(fragment.content,NodeFilter.SHOW_TEXT);let node;while((node=walker.nextNode())){const value=node.nodeValue;if(value.trim()==='Not supplied'){node.nodeValue=value.replace('Not supplied','N/A');}else{node.nodeValue=value.replace(/(^|\bRM\s+|\bPBT\s+|\bBAU\s+|Δ\s+)—(?=$|\s|·)/g,'$1N/A');}}return fragment.innerHTML;}
function pbtWaterfall(){
  const sheet='2027 PBT Bridge Inputs', rows=Array.from({length:12},(_,i)=>i+5), values=rows.map(r=>n(sheet,r,2));
  if(values.some(v=>v===null))return empty('Complete the 2027 PBT Bridge Inputs sheet');
  const labels=[['9.3% margin','benchmark'],['Land lease','rate'],['Overseas','travel'],['Better service','FM'],['Exploratory','fees'],['ERP · SAP','+ NetSuite'],['Manpower','+ key hiring'],['PBT before','financing'],['Upfront','financing fee'],['Profit','charges'],['Others'],['2027 budget','PBT']];
  const descriptions=[['2026 margin on','2027 income'],['Higher annual','lease obligation'],['None in 2026','for named leaders'],['Minimum wage;','service scope'],['MICE and VC','exploration'],['Licences, support','and training'],['Increments,','promotions, hiring'],['After operating','pressures'],['One-off fee;','stamp duty'],['Higher in 2028–30;','excludes government','profit subsidy'],['Other movements'],['After financing','and others']];
  const y=v=>610-v*27.7, x=i=>70+i*145, width=68, base=y(0); let running=values[0], out='';
  out+=`<path d="M45 ${base} H1745" stroke="#aabac5" stroke-width="1.5"/>`;
  out+=`<rect x="${x(1)-26}" y="64" width="${x(6)+width-x(1)+52}" height="${base-75}" rx="8" fill="none" stroke="#dce6ec" stroke-width="1.5"/>`;
  out+=text(x(1),36,'OPERATING PRESSURES','wf-section')+text(x(8),36,'FINANCING & OTHER','wf-section')+text(1720,36,'RM MILLION','wf-section','end');

  rows.forEach((r,i)=>{
    const v=values[i], total=[0,7,11].includes(i), before=running;
    if(i===0)running=v;else if(total)running=v;else running+=v;
    const top=total?y(Math.max(0,v)):y(Math.max(before,running));
    const bottom=total?y(Math.min(0,v)):y(Math.min(before,running));
    const color=total?'#123f69':i===8||i===9?'#7095af':'#a2bfd0';
    if(i>0)out+=`<path d="M${x(i-1)+width} ${y(before)} H${x(i)}" stroke="#9badba" stroke-width="1.5" stroke-dasharray="5 6"/>`;
    out+=`<rect x="${x(i)}" y="${top}" width="${width}" height="${Math.max(1,bottom-top)}" fill="${color}">${tip(`${cell(sheet,r,1)}: RM ${v.toFixed(2)}m. ${cell(sheet,r,4)||''}`)}</rect>`;
    out+=text(x(i)+width/2,top-12,(v<0?'−':'')+Math.abs(v).toFixed(2),'wf-value','middle');
    labels[i].forEach((line,j)=>out+=text(x(i)+width/2,base+31+j*24,line,'wf-label','middle'));
    descriptions[i].forEach((line,j)=>out+=text(x(i)+width/2,base+96+j*19,line,'wf-desc','middle'));
    if(String(cell(sheet,r,3)||'').toLowerCase().startsWith('yes'))out+=text(x(i)+width/2,base+96+descriptions[i].length*19+4,'🔁 Recurring','wf-desc','middle');
  });

  const difference=running-(values[0]+values.slice(1,7).reduce((a,b)=>a+b,0)+values.slice(8,11).reduce((a,b)=>a+b,0));
  if(Math.abs(difference)>.005)out+=text(1000,80,'Reconciliation differs from supplied budgeted PBT; review source inputs.','wf-note');
  return `<svg class="waterfall" viewBox="0 0 1768 790" role="img" aria-label="Waterfall reconciliation of 2027 PBT benchmark to budget" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;
}
const renders=[overview,pbtWaterfall,capex,longRange,mix,statements,()=>comparisonWithBadDebts(6),()=>comparisonWithBadDebts(7)];const stage=document.getElementById('stage');renders.forEach((render,i)=>{const section=document.createElement('section');section.className='slide';section.id='S'+String(i+1).padStart(2,'0');section.setAttribute('aria-label',`${i+1}. ${titles[i]}`);let body;try{body=render();}catch(e){body=empty('Unable to render these workbook values: '+e.message);}body=slideMissingValues(body);section.innerHTML=`<div class="confidential">Strictly privileged<br>& confidential</div><div class="eyebrow">BP2027 · Board engagement</div><h1>${esc(i===1?'Why 2027 PBT falls below the 2026 BAU margin':cell('Deck Content',6+i,2)||titles[i])}</h1><div class="commentary">${esc(i===1?'FY2026 projected PBT margin of 9.3% applied to the FY2027 income target establishes the benchmark.':cell('Deck Content',6+i,3))}</div><div class="body">${body}</div><footer class="footer"><span>BP2027 · ${esc(DATA.meta?.workbook_name||'Workbook not supplied')} · ${i===1||i>=6?'Figures RM million · 2 decimals':'Figures RM unless stated'}</span><span>${String(i+1).padStart(2,'0')} / 08</span></footer>`;stage.appendChild(section);});
let current=0;try{const v=Number(localStorage.getItem('bp2027-slide'));if(Number.isInteger(v)&&v>=0&&v<8)current=v;}catch(e){}const selector=document.getElementById('selector');selector.innerHTML=titles.map((t,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${esc(t)}</option>`).join('');function go(i){current=Math.max(0,Math.min(7,i));document.querySelectorAll('.slide').forEach((el,j)=>{el.classList.toggle('active',j===current);el.setAttribute('aria-hidden',j===current?'false':'true');});selector.value=String(current);document.getElementById('count').textContent=`${current+1} / 8`;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===7;try{localStorage.setItem('bp2027-slide',String(current));}catch(e){}if(!document.getElementById('source-drawer').hidden)showSources();}function fit(){const v=document.getElementById('viewport');stage.style.transform=`scale(${Math.min(v.clientWidth/1920,v.clientHeight/1080)})`;}async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){document.getElementById('status').textContent='Fullscreen is unavailable in this browser context.';}}
function nonblankRows(name,start=1,end=Infinity){return(DATA.sheets[name]||[]).map((row,i)=>({row,i:i+1})).filter(o=>o.i>=start&&o.i<=end&&o.row?.some(v=>v!==null&&v!==''));}function rawTable(name){const rows=nonblankRows(name);if(!rows.length)return '<p>Not supplied</p>';return `<div class="raw"><table><tbody>${rows.map(o=>`<tr><th>${o.i}</th>${o.row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}function showSources(){const id='S'+String(current+1).padStart(2,'0'),meta=DATA.meta||{};const sources=['S01 Overview','S02 Profit Bridge','S03 CAPEX','S04 Long Range','S05 Revenue Mix','S06 Financial Outlook','S07 Historical','S08 Budget vs Forecast'];let h=`<h2>${id} · Sources & basis</h2><p>Workbook: ${esc(meta.workbook_name||'Not supplied')}\nWorkbook saved: ${esc(meta.workbook_saved_at||'Not supplied')}\nRefreshed: ${esc(meta.refreshed_at||'Not supplied')}</p><h3>Slide source / general remarks</h3><p>${esc(cell('Deck Content',current+6,4)||'Not supplied')}</p><h3>Workbook general remarks</h3><p>${esc((DATA.sheets['Deck Content']?.[24]||[]).filter(v=>v!==null&&v!=='').join(' · ')||'Not supplied')}</p><h3>P&L source remarks</h3><p>${esc((DATA.sheets['P&L Inputs']?.[31]||[]).filter(v=>v!==null&&v!=='').join(' · ')||'Not supplied')}</p><h3>Narrative working basis · not slide commentary</h3><p>${esc((DATA.sheets['Narrative Inputs']?.[current+5]||[]).slice(1).filter(v=>v!==null&&v!=='').join('\n')||'Not supplied')}</p><p>Unknown amounts remain blank. Percentage changes are undefined when the comparison base is zero. Historical reported totals are retained as supplied. Positive expense convention applies to P&L; cash flows retain their supplied signs.</p>`;const names=[sources[current]];if(current===1)names.push('P&L Inputs','Initiatives Inputs');if(current===2)names.push('CAPEX Inputs');if(current===5)names.push(...statementNames);names.forEach(name=>h+=`<details><summary>${esc(name)} · supplied cells</summary>${rawTable(name)}</details>`);document.getElementById('source-content').innerHTML=h;document.getElementById('source-drawer').hidden=false;}
document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);selector.onchange=()=>go(Number(selector.value));document.getElementById('fullscreen').onclick=fullscreen;document.getElementById('sources').onclick=showSources;document.getElementById('close-sources').onclick=()=>document.getElementById('source-drawer').hidden=true;document.getElementById('print').onclick=()=>window.print();window.addEventListener('resize',fit);document.addEventListener('fullscreenchange',fit);document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='Escape'){document.getElementById('source-drawer').hidden=true;return;}if(!document.getElementById('source-drawer').hidden)return;const actions={ArrowLeft:()=>go(current-1),ArrowRight:()=>go(current+1),Home:()=>go(0),End:()=>go(7),f:fullscreen,F:fullscreen};if(actions[e.key]){e.preventDefault();actions[e.key]();}});go(current);fit();
