  if(mapped==='income-appendix'){document.getElementById('source-content').innerHTML=`<h2>10 · Sources & basis</h2><p>2026 saved adjusted estimate by division; 2027 saved Master Detail submitted income by division. Allocations are not like-for-like; FD / Repo is included in All divisions only. All divisions includes forecast from divisions without a 2027 submission. Detail is a fixed snapshot; matching category totals cannot detect offsetting changes or reallocations.</p><details open><summary>P&L Inputs</summary>${rawTable('P&L Inputs')}</details>`;document.getElementById('source-drawer').hidden=false;return;}
  if(mapped==='revenue'){document.getElementById('source-content').innerHTML=`<h2>03 · Sources & basis</h2><p>2026 forecast and 2027 budget income; includes FD / Repo income. Values use the embedded workbook snapshot.</p><details open><summary>P&L Inputs</summary>${rawTable('P&L Inputs')}</details>`;document.getElementById('source-drawer').hidden=false;return;}
  if(mapped==='cost-appendix'){document.getElementById('source-content').innerHTML=`<h2>11 · Sources & basis</h2><p>Eight cost categories from P&L Inputs rows 18–25; FY2026 forecast (column F) and FY2027 full-plan budget (column H). Bad and doubtful debts, depreciation and financing are excluded. Values use the embedded workbook snapshot.</p><details open><summary>P&L Inputs</summary>${rawTable('P&L Inputs')}</details>`;document.getElementById('source-drawer').hidden=false;return;}
  if(mapped===null){document.getElementById('source-content').innerHTML=`<h2>${String(displayed+1).padStart(2,'0')} · Sources & basis</h2><p>Board support items provided by management.</p>`;document.getElementById('source-drawer').hidden=false;return;}
  current=mapped;try{originalShowSources();document.querySelector('#source-content h2').textContent=`S${String(displayed+1).padStart(2,'0')} · Sources & basis`;if(mapped===1)document.getElementById('source-content').insertAdjacentHTML('afterbegin',`<details open><summary>2027 PBT Bridge Inputs · Base-case saved snapshot</summary>${rawTable('2027 PBT Bridge Inputs')}</details>`);}finally{current=displayed;}
};
document.getElementById('sources').onclick=showSources;
document.addEventListener('keydown',e=>{if(e.key==='End'&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&document.getElementById('source-drawer').hidden){e.preventDefault();e.stopImmediatePropagation();go(retainedSlideIndexes.length-1);}},true);
function landBasis(){return `2027 ${landCase} land scenario: income, PBT and restricted closing cash reduced by RM ${fmt(landDeferrals[landCase])}; unchanged costs and unrestricted cash. Proposed OE grant for 2028 / 2029 / 2030: RM ${oeCase.replaceAll('-', ' / ')}m; PBT also reflects the selected cost escalation. Other later-year monetary projections remain unchanged; cash impacts are not modelled. Source tables below are the unadjusted embedded snapshot, not scenario figures. Slide 2 is a fixed Base-case bridge independent of the selected scenario. The saved bridge total is RM0.416m versus Base-case budget PBT RM0.42m; the RM0.004m difference is accepted at two-decimal RMm presentation. Bridge inputs are a separate saved snapshot; other sheets retain their prior snapshot.`;}
const snapshotSources=showSources;
showSources=function(){if(retainedSlideIndexes[current]==='cost-appendix'){snapshotSources();return;}snapshotSources();document.getElementById('source-content').insertAdjacentHTML('afterbegin',`<p class="land-basis">${esc(landBasis())}</p>`);};
document.getElementById('sources').onclick=showSources;
function renderLandScenario(){
  const delta=landDeferrals[landSelect.value];if(delta===undefined)return;
  landCase=landSelect.value;
  incomeAppendix.querySelector('.body').innerHTML=incomeCategoryStack(incomeSelect.value);
  overviewBody.querySelector('.overview').outerHTML=slideMissingValues(overview());
  overviewComment.textContent=delta?'2027 land deferrals applied to scenario views; slide 2 remains Base-only. Later-year OE and cost scenarios shown on the outlook.':originalOverviewComment;
  landNote.textContent=`${landCase==='best'?'Saved workbook basis':`Income / PBT / restricted cash − RM ${fmt(delta)}`} · slide 2 remains Base-only`;
  document.querySelector('#S02 .body').innerHTML=slideMissingValues(pbtWaterfall());
  document.querySelector('#S02 .commentary').textContent='Base case only · fixed bridge independent of the selected land scenario. Bridge PBT RM0.416m; Base-case budget PBT RM0.42m (RM0.004m difference).';
  document.querySelector('#revenue-waterfall .body').innerHTML=slideMissingValues(revenueWaterfall());
  document.querySelector('#S05 .body').innerHTML=slideMissingValues(mix());
  document.querySelector('#S08 .body').innerHTML=slideMissingValues(comparisonWithBadDebts(7));
  document.querySelectorAll('#S08 .financial tbody tr').forEach(row=>{if(row.firstElementChild?.textContent.trim()==='MaGIC Mandated Program')row.firstElementChild.textContent='Tech Commercialisation Development Services';});
  document.querySelectorAll('#S08 .financial tbody tr').forEach(row=>{if(['Park Management Fee','Extraordinary & One-offs (expense)'].includes(row.firstElementChild?.textContent.trim()))row.remove();});
  outlookChart.innerHTML=slideMissingValues(longRange());
  if(!costSelect.disabled)costSelect.dispatchEvent(new Event('change'));
  outlookChart.querySelectorAll('.axis.val').forEach(el=>el.remove());polishOutlookChart();
  if(!document.getElementById('source-drawer').hidden)showSources();
}
landSelect.addEventListener('change',renderLandScenario);renderLandScenario();
go(0);
</script></body></html>
